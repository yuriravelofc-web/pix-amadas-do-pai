<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>PIX · Mulheres Amadas do Pai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1c1a1f;--muted:#857b88;--purple:#7a3d8c;--purple-d:#652b78;--line:#dcc9e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;position:relative;overflow-x:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fdf6f8;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
radial-gradient(60% 45% at 8% 6%,rgba(244,190,208,.55),transparent 70%),
radial-gradient(55% 45% at 95% 12%,rgba(205,176,230,.5),transparent 70%),
radial-gradient(60% 45% at 5% 95%,rgba(205,176,230,.45),transparent 70%),
radial-gradient(60% 50% at 98% 92%,rgba(244,190,208,.5),transparent 70%),
linear-gradient(160deg,#fdf3f6,#f5eefa)}
.bg svg{position:absolute;width:min(46vw,300px);height:auto;color:#8a5a9c;opacity:.38}
.bg .tl{top:-10px;left:-10px}
.bg .tr{top:-10px;right:-10px;transform:scaleX(-1)}
.bg .bl{bottom:-10px;left:-10px;transform:scaleY(-1)}
.bg .br{bottom:-10px;right:-10px;transform:scale(-1,-1)}
main{position:relative;z-index:1;width:100%;max-width:520px;text-align:center}
.logo{display:block;width:min(86%,400px);height:auto;margin:0 auto 24px}
.card{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:24px;padding:26px 20px 24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(122,61,140,.14)}
.pix{font-family:"Playfair Display",Georgia,serif;font-size:clamp(3.4rem,18vw,5.2rem);font-weight:500;color:var(--purple);line-height:1;margin:0 0 14px}
.lbl{color:var(--muted);font-size:1.05rem;margin:0 0 6px}
.key{font-size:clamp(1.7rem,9vw,2.6rem);font-weight:700;letter-spacing:-.02em;word-break:break-all;margin:0 0 20px;user-select:all}
button.copy{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:360px;padding:16px 20px;border:0;border-radius:16px;background:var(--purple-d);color:#fff;font:600 1.15rem Inter,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(101,43,120,.35);transition:transform .12s,background .2s}
button.copy:active{transform:scale(.97)}
button.copy.ok{background:#2e7d4f}
button.copy svg{width:22px;height:22px;flex:none}
.hint{font-size:.85rem;color:var(--muted);margin:14px 0 0}
footer{margin-top:22px;color:var(--muted);font-size:.9rem;line-height:1.5}
footer b{display:block;font-size:1rem;font-weight:500;color:var(--ink);opacity:.8}
.toast{position:fixed;z-index:5;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#2a2230;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:.95rem;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
(function(){
  var key=document.getElementById('key').textContent.trim();
  var btn=document.getElementById('btn'),txt=document.getElementById('btnTxt'),toast=document.getElementById('toast'),t;
  function done(ok){
    toast.textContent=ok?'Chave PIX copiada!':'Segure a chave e copie manualmente';
    toast.classList.add('show');
    if(ok){btn.classList.add('ok');txt.textContent='Copiado!';}
    clearTimeout(t);
    t=setTimeout(function(){toast.classList.remove('show');btn.classList.remove('ok');txt.textContent='Toque para copiar';},2200);
  }
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=key;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);
      var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok);
    }catch(e){done(false);}
  }
  btn.addEventListener('click',function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(key).then(function(){done(true);},fallback);
    }else{fallback();}
  });
})();
